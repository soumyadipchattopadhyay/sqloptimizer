<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PwC SQLator - Launchpad</title>
    <link rel="stylesheet" href="static/css/index.css">
</head>
<body>

    <div class="launchpad-container">
        
        <!-- Header Section -->
        <div class="header">
            <img src="pwc-seeklogo.png" alt="PwC SQLator Logo" class="app-logo">
            <h1>PwC SQLator</h1>
            

            <!-- Model Selection Dropdown -->
            <div class="model-selector-container">
                <label for="modelSelect">AI Model Engine:</label>
                <select id="modelSelect" class="model-select">  
                    <option value="gemini-3.7-flash">gemini-3.7-flash</option>
                    <option value="gemini-3.6-flash">gemini-3.6-flash</option>
                    <option value="gemini-3.5-flash">gemini-3.5-flash</option>
                    <option value="gemini-3.5-flash-lite">gemini-3.5-flash-lite</option>
                    <option value="gemini-3.1-flash-lite">gemini-3.1-flash-lite</option>
                </select>
            </div>
        </div>

        <!-- Horizontal Cards Layout -->
        <div class="cards-grid">
            
            <!-- Option 1: Fusion & EBS -->
            <a href="fusion-ebs" class="card">
                <div class="icon-badge">
                    <svg viewBox="0 0 24 24">
                        <ellipse cx="12" cy="5" rx="9" ry="3"></ellipse>
                        <path d="M3 5V19A9 3 0 0 0 21 19V5"></path>
                        <path d="M3 12A9 3 0 0 0 21 12"></path>
                    </svg>
                </div>
                <div class="card-title">Generate and Optimize Fusion/EBS Queries</div>
                <div class="card-desc">Oracle Fusion Cloud Applications and EBS R12 schema query generation and performance tuning.</div>
                <div class="card-btn">Launch</div>
            </a>

                        <line x1="9" y1="19" x2="16" y2="19"></line>
                        <line x1="9" y1="15" x2="16" y2="15"></line>
                    </svg>
                </div>
                <div class="card-title">Generate and Optimize PaaS Query</div>
                <div class="card-desc">Performance optimization workspace tailored for Autonomous Database (ATP/ADW) and PaaS instances.</div>

            </a>

                <div class="card-desc">Automated PL/SQL package development workspace designed to generate production-ready package specifications and bodies.</div>

    </div>

    <!-- Footer Section -->
    <div class="footer">
        Developed by PwC India

    <script src="/static/js/index.js"></script>
